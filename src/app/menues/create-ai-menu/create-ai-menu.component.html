<main>
    <div class="main-wrapper">
        <!-- Page Content :: Start  -->
        <div id="content">
            <!-- Top Bar :: Start -->
            <app-header></app-header>
            <!-- Top Bar :: End -->

<div class="mainTabss">
    <app-tabs></app-tabs>
     <div class="main-area position-relative">
                
                <div class="page-card-body p-20">
                    <div class="row">
                        <div class="col-lg-8">
                            <div class="mb-20">
                                <div class="card border-radius-10 mb-4 main-bg-color">
                                    <div class="card-body p-20">
                                        <div class="row">
                                            <div class="col-lg-3">
                                                <div class="mt-3">
                                                <div class="form-group">
                                                <label class="text-uppercase font-weight-400 font-12 mb-10">Menu Title</label>
                                                <input type="text" name="title" id="title" class="form-control" placeholder="">
                                                </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mt-3">
                                                <div class="form-group">
                                                <label class="text-uppercase font-weight-400 font-12 mb-10">Customer Name</label>
                                                <input type="text" name="customer_name" id="customer_name" class="form-control" placeholder="">
                                                </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mt-3">
                                                <div class="form-group">
                                                <label class="text-uppercase font-weight-400 font-12 mb-10">Customer Phone</label>
                                                <input type="text" maxlength="10" name="customer_phone" id="customer_phone" class="form-control" placeholder="">
                                                </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mt-3">
                                                <div class="form-group">
                                                <label class="text-uppercase font-weight-400 font-12 mb-10">Function Date</label>
                                                <input type="date" name="function_date" id="function_date" class="form-control" placeholder="">
                                                </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mt-3">
                                                <div class="form-group">
                                                <label class="text-uppercase font-weight-400 font-12 mb-10">Location</label>
                                                <input type="text" name="location" id="location" class="form-control" placeholder="">
                                                </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-3">
                                                <div class="mt-3">
                                                <div class="form-group">
                                                <label class="text-uppercase font-weight-400 font-12 mb-10">No of Guest</label>
                                                <input type="text" name="no_of_guest" id="no_of_guest" class="form-control" placeholder="">
                                                </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-12">
                                                <div class="mt-3">
                                                <div class="form-group">
                                                <label class="text-uppercase font-weight-400 font-12 mb-10">Special Note</label>
                                                <textarea class="form-control" name="description" id="description"></textarea>
                                                </div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        

                                        <div class="mt-3">
                                            <div *ngFor="let menu of this.menues; let i=index" style="background: lightgoldenrodyellow; margin-bottom: 20px;" class="row">
                                                <div class="col-lg-6">
                                                    <div class="form-group">
                                                        <label class="text-uppercase font-weight-400 font-12 mb-10">Category</label>
                                                        <select [id]="'category_id_'+i" (change)="setCateId(i)" class="form-select">
                                                        <option value="">Select</option>
                                                        <option *ngFor="let category of this.categories;" value="{{category?.id}}">{{category?.title}}</option>
                                                        </select>
                                                    </div>
                                                </div>
                                                <div class="col-lg-3">
                                                <div class="form-group">
                                                <label class="text-uppercase font-weight-400 font-12 mb-10">No of Item</label>
                                                <input type="text"[id]="'no_of_item_'+i" (blur)="setNoOfItem(i)" class="form-control" placeholder="">
                                                </div>
                                            </div>
                                                <div class="col-lg-3" style="margin-top: 34px;">
                                                    <a (click)="removeRow(i)" class="btn btn-danger btn-sm text-uppercase">Delete</a>
                                                </div>
                                                
                                            </div>

                                        </div>

                                        <div class="mt-3">                                                                                            <a class="btn btn-primary btn-sm custom_btn" (click)="addMoreRow()">Add Category</a>
                                        </div>
                                        
                                       
                                        <!-- {{this.menues | json}}  -->
                                    </div>
                                </div>
                            </div>
                            
                        </div>
                        <div class="col-lg-4"><button type="button" (click)="Create()" id="profileUpdateBtn" class="btn btn-primary btn-sm text-uppercase">Submit</button>&nbsp;<a routerLink="/menu-list"  class="btn btn-primary btn-sm text-uppercase">Back</a></div>
                        
                    </div>
                    
                </div>
            </div>
</div>
            <!-- main Area :: Start -->
           
            <!--Footer :: Start-->
        </div>
        <!-- Page Content :: End -->
        <app-footer></app-footer>
        <!--Footer :: End-->
    </div>
</main>

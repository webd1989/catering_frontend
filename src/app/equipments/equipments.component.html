<main>
    <div class="main-wrapper">
        <!-- Page Content :: Start  -->
        <div id="content">
            <app-header></app-header>

            <div class="mainTabss">
                <app-tabs></app-tabs>
            <!-- main Area :: Start -->
            <div class="main-area position-relative">
                <div class="page-card-title align-items-center justify-content-between">
                     <div class="row">
                        <div class="col-lg-2 col-6 mb-2">
                            <input type="text" name="title_search" id="title_search" class="form-control filter-p" placeholder="Title">
                        </div>
                        <div class="col-lg-2 col-6 mb-2">
                        <select name="status_search" id="category_search" class="form-select">
                        <option value="">Select Category</option>
                        <option *ngFor="let category of categories" value="{{category?.id}}">{{category?.title}}</option>
                        </select>
                        </div>
                        <div class="col-lg-2 col-6 mb-2">
                        <select name="status_search" id="status_search" class="form-select">
                        <option value="">Status</option>
                        <option value="1">Active</option>
                        <option value="2">Inactive</option>
                        </select>
                        </div>
                        
                        <div class="col-lg-2 col-6 mb-2">
<a (click)="searchData();" id="" class="btn btn-warning btn-sm text-uppercase"><i class="fas fa-search"></i></a>
                            <a (click)="reset();" style="margin-left: 10px;"  class="btn btn-primary btn-sm text-uppercase" title="Reset"><i class="fas fa-retweet"></i></a>
                            <a href="javascript:;" (click)="setHeading()"  data-bs-toggle="modal" data-bs-target="#createTemplate"style="margin-left: 10px;"  class="btn btn-warning btn-sm text-uppercase" title="Create Invoice"><i class="fas fa-plus"></i></a>
                        </div>
                    </div>
                    
                </div>
                <div class="page-card-body p-3">
                    <div class="table-responsive">
                            <table class="table table-bordered table-striped position-relative">
                                <thead>
                                    <tr>
                                        <th class="text-uppercase whitespace-nowrap">S.NO</th>
                                        <th class="text-uppercase whitespace-nowrap">Category</th>
                                        <th class="text-uppercase whitespace-nowrap">Title</th>
                                        <th class="text-uppercase whitespace-nowrap">Unit</th>
                                        <th class="text-uppercase whitespace-nowrap">Current Stock</th>
                                        <th class="text-uppercase whitespace-nowrap">Purchase Rate</th>
                                        <th class="text-uppercase whitespace-nowrap">Status</th>
                                        <th class="text-uppercase whitespace-nowrap">Created Date</th>
                                        <th class="text-uppercase whitespace-nowrap">ACTION</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let user of users | paginate: { itemsPerPage: 10, currentPage: p, totalItems: total }; index as i">
                                        <td class="whitespace-nowrap">{{i+1}}</td>
                                      
                                
                                        <td class="whitespace-nowrap">{{user.cate_name}}</td>
                                        <td class="whitespace-nowrap">{{user.material_name}}</td>
                                        <td class="whitespace-nowrap">{{user.unit_name}}</td>
                                        <td class="whitespace-nowrap">{{user.current_stock}}</td>
                                        <td class="whitespace-nowrap">{{user.purchase_rate}}</td>
                                        <td>
                                            <a style="cursor:pointer" (click)="updateStatus(user.id,'2')" *ngIf="user.status == 1" class="btn btn-sm btn-outline-success text-uppercase text-center font-12 me-2">Active</a>
                                            <a style="cursor:pointer" (click)="updateStatus(user.id,'1')" *ngIf="user.status == 2" class="btn btn-sm btn-outline-danger text-uppercase text-center font-12 me-2">Inactive</a>
                                        </td>
                                        <td class="text-capitalize whitespace-nowrap">{{user.display_date}}</td>
                                        <td class="text-capitalize whitespace-nowrap">
                                            <a href="javascript:;" data-bs-toggle="modal" data-bs-target="#createTemplate" (click)="getQuotation(user.id)" class="text-capitalize font-12 text-info me-3">
                                                <i class="far fa-edit"></i>
                                            </a>
                                            <a href="javascript:;" (click)="Delete(user.id)" class="text-capitalize font-12 text-red" data-bs-toggle="modal" data-bs-target="#deleteTemplate">
                                                <i class="far fa-trash-alt"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr><td colspan="10"><div class="pagiation"><pagination-controls (pageChange)="pageChangeEvent($event)"></pagination-controls></div></td></tr>

                                    
                                </tbody>
                            </table>
                        </div>
                </div>
            </div>
            <!-- main Area :: End -->
            </div>

            <!--Footer :: Start-->
        </div>
        <app-footer></app-footer>
    </div>
</main>
<!-- CreateTemplate Edit Modal Starts  -->
<div class="modal fade" id="createTemplate">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header border-0 text-bg-light align-items-center">
                <div></div>
                <div class="">
                    <h4 class="modal-title font-16">{{heading}}</h4>
                </div>
                <button type="button" class="btn-close font12" data-bs-dismiss="modal"></button>
            </div>
            <!-- Modal body -->
            <div class="modal-body">
                <form class="mt-0">
                    <div class="row">
                    
                    <div class="col-lg-6">
                    <div class="form-group mb-3">
                     <select class="form-select" id="category_id">
                        <option value="">Select Category</option>
                        <option *ngFor="let category of categories" value="{{category?.id}}">{{category?.title}}</option>
                     </select>
                     <input type="hidden" id="r_id"/>
                    </div>
                    </div>

                    <div class="col-lg-6">
                    <div class="form-group mb-3">
                     <input type="text" class="form-control" id="material_name" placeholder="Please Enter Name"/>
                    </div>
                    </div>
                    <div class="col-lg-6">
                    <div class="form-group mb-3">
                     <select class="form-select" id="unit_id">
                        <option value="">Select Unit</option>
                        <option *ngFor="let unit of units" value="{{unit?.id}}">{{unit?.unit_name}}</option>
                     </select>
                    </div>
                    </div>
                    <div class="col-lg-6">
                    <div class="form-group mb-3">
                     <input type="text" class="form-control" id="current_stock" placeholder="Please Enter Current Stock"/>
                    </div>
                    </div>
                    <div class="col-lg-6">
                    <div class="form-group mb-3">
                     <input type="text" class="form-control" id="purchase_rate" placeholder="Please Enter Purchasing Rate"/>
                    </div>
                    </div>
                    </div>
                   <!--  {{this.quantities | json}} -->
                </form>

            </div>
            <!-- Modal footer -->
            <div class="modal-footer d-flex justify-content-center align-items-center">
                <button type="button" id="closeBtn" class="btn btn-outline-light text-dark btn-sm text-uppercase" data-bs-dismiss="modal">Close</button>
                <button type="button" (click)="Create()" id="addUserBtn" class="btn btn-primary btn-sm text-uppercase">Save</button>
            </div>
        </div>
    </div>
</div>
<!-- CreateTemplate Edit Modal Ends  -->

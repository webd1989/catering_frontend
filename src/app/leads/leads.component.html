<main>
    <div class="main-wrapper">
        <!-- Page Content :: Start  -->
        <div id="content">
            <app-header></app-header>

            <div class="mainTabss">
                <app-tabs></app-tabs>
            <!-- main Area :: Start -->
            <div class="main-area position-relative">
                <div class="page-card-title align-items-center justify-content-between">
                     <div class="row">
                        <div class="col-lg-2 col-6 mb-2">
                            <input type="text" name="title_full_name" id="title_full_name" class="form-control filter-p" placeholder="Name">
                        </div>
                        <div class="col-lg-2 col-6 mb-2">
                            <input type="text" name="title_mobile" id="title_mobile" class="form-control filter-p" placeholder="Mobile">
                        <!-- <select name="status_search" id="status_search" class="form-select">
                        <option value="">Status</option>
                        <option value="1">Active</option>
                        <option value="2">Inactive</option>
                        </select> -->
                        </div>
                        
                        <div class="col-lg-2 col-6 mb-2">
<a (click)="searchData();" id="" class="btn btn-warning btn-sm text-uppercase"><i class="fas fa-search"></i></a>
                            <a (click)="reset();" style="margin-left: 10px;"  class="btn btn-primary btn-sm text-uppercase" title="Reset"><i class="fas fa-retweet"></i></a>
                            <!-- <a href="javascript:;" (click)="setHeading()"  data-bs-toggle="modal" data-bs-target="#createTemplate"style="margin-left: 10px;"  class="btn btn-warning btn-sm text-uppercase" title="Create Invoice"><i class="fas fa-plus"></i></a> -->
                        </div>
                    </div>
                    
                </div>
                <div class="page-card-body p-3">
                    <div class="table-responsive">
                            <table class="table table-bordered table-striped position-relative">
                                <thead>
                                    <tr>
                                        <th class="text-uppercase whitespace-nowrap">S.NO</th>
                                        <th class="text-uppercase whitespace-nowrap">Lead Code</th>
                                        <th class="text-uppercase whitespace-nowrap">Name</th>
                                        <th class="text-uppercase whitespace-nowrap">Mobile</th>
                                        <th class="text-uppercase whitespace-nowrap">Country</th>
                                        <th class="text-uppercase whitespace-nowrap">State</th>
                                        <th class="text-uppercase whitespace-nowrap">City</th>
                                        <th class="text-uppercase whitespace-nowrap">Created Date</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let user of users | paginate: { itemsPerPage: 10, currentPage: p, totalItems: total }; index as i">
                                        <td class="whitespace-nowrap">{{i+1}}</td>
                                      
                                
                                        <td class="whitespace-nowrap">{{user?.lead_code}}</td>
                                        <td class="whitespace-nowrap">{{user?.full_name}}</td>
                                        <td class="whitespace-nowrap">{{user?.mobile}}</td>
                                        <td class="whitespace-nowrap">{{user?.country}}</td>
                                        <td class="whitespace-nowrap">{{user?.state}}</td>
                                        <td class="whitespace-nowrap">{{user?.city}}</td>
                                        <td class="text-capitalize whitespace-nowrap">{{user.display_date}}</td>
                                        
                                    </tr>
                                    <tr><td colspan="10"><div class="pagiation"><pagination-controls (pageChange)="pageChangeEvent($event)"></pagination-controls></div></td></tr>

                                    
                                </tbody>
                            </table>
                        </div>
                </div>
            </div>
            <!-- main Area :: End -->
            </div>

            <!--Footer :: Start-->
        </div>
        <app-footer></app-footer>
    </div>
</main>
<!-- CreateTemplate Edit Modal Starts  -->
<div class="modal fade" id="createTemplate">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header border-0 text-bg-light align-items-center">
                <div></div>
                <div class="">
                    <h4 class="modal-title font-16">{{heading}}</h4>
                </div>
                <button type="button" class="btn-close font12" data-bs-dismiss="modal"></button>
            </div>
            <!-- Modal body -->
            <div class="modal-body">
                <form class="mt-0">
                    <div class="row">
                    
                    <div class="col-lg-12">
                    <div class="form-group mb-3">
                     <input type="text" class="form-control" id="title" placeholder="Please Enter Title"/>
                     <input type="hidden" id="r_id"/>
                    </div>
                    </div>
                    <div class="col-lg-12">
                    <div class="form-group mb-3">
                     <textarea class="form-control" id="description" placeholder="Please Enter Description"></textarea>
                    </div>
                    </div>
                    </div>
                   <!--  {{this.quantities | json}} -->
                </form>

            </div>
            <!-- Modal footer -->
            <div class="modal-footer d-flex justify-content-center align-items-center">
                <button type="button" id="closeBtn" class="btn btn-outline-light text-dark btn-sm text-uppercase" data-bs-dismiss="modal">Close</button>
                <button type="button" (click)="Create()" id="addUserBtn" class="btn btn-primary btn-sm text-uppercase">Save</button>
            </div>
        </div>
    </div>
</div>
<!-- CreateTemplate Edit Modal Ends  -->
